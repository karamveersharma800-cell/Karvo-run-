<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karvo Run</title>
<meta name="description" content="Karvo Run: a fast platformer game. Race the world for the top score.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%84%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>:root{--bg:#14213d;--gold:#ffb703;--red:#d00000;--ink:#fff;--deep:#0b132b;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:'Press Start 2P',monospace,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#6ec6ff;display:block}
#hud{position:absolute;inset:0;z-index:3;pointer-events:none}
body:not(.playing) #hud{display:none}
#bar{position:absolute;top:34px;right:10px;display:flex;gap:6px;pointer-events:auto}
#bar button{background:rgba(65,90,119,.82);font-size:10px;padding:9px 10px}
#pad{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;user-select:none;-webkit-user-select:none;touch-action:none;pointer-events:none}
#pad button{pointer-events:auto;touch-action:none;width:78px;height:78px;border-radius:50%;padding:0;font-size:24px;background:rgba(29,53,87,.72);border:3px solid rgba(255,255,255,.55)}
#bj{margin-left:auto;width:96px!important;height:96px!important;font-size:14px!important;background:rgba(231,111,0,.82)!important}
#pad[hidden]{display:none}
[hidden]{display:none!important}
#menu{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#0b132b,#1c2e5a);padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
h1{margin:0;font-size:clamp(28px,10vw,60px);color:var(--gold);text-shadow:4px 4px 0 var(--red)}
p,small{font-size:clamp(8px,2.4vw,11px);line-height:1.8;margin:0;max-width:520px}
button{font-family:inherit;font-size:clamp(10px,3vw,14px);border:0;border-bottom:4px solid rgba(0,0,0,.4);border-radius:8px;padding:14px 16px;color:#fff;cursor:pointer}
#menu button{width:min(88%,360px)}
#b1{background:#2a9d4a;font-size:clamp(14px,4.4vw,20px);padding:20px 16px}
#b2{background:#c1121f}
#b3{background:#5a189a}
#skin,#lo,#hp,#pwset,#cpw{background:#0b7285;padding:11px 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#pw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(88%,360px)}
#pwi{font-family:inherit;font-size:13px;padding:12px;border-radius:8px;border:2px solid var(--gold);background:var(--deep);color:#fff;flex:1;min-width:150px}
#pwok{background:var(--gold);color:#000;width:auto!important}
#err{width:100%;color:#ff6b6b;font-size:9px;min-height:12px}
#pz,#mu,#home{background:rgba(65,90,119,.82)}
.fld{font-family:inherit;font-size:13px;padding:12px;border-radius:8px;border:2px solid var(--gold);background:var(--deep);color:#fff;width:100%;margin:4px 0}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:#243b53;padding:9px 10px;width:auto}
.tabs button.on{background:var(--gold);color:#000}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.err{color:#ff9e9e;min-height:12px}
#who{display:flex;flex-direction:column;align-items:center;gap:6px}
#hi{font-size:clamp(10px,3vw,14px);color:var(--gold)}
#nmsg{font-size:8px;line-height:1.6;color:#ff9e9e;min-height:10px}
#avg{font-size:9px;color:#7be495}
#panel{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,19,43,.98);padding:16px;overflow:auto;text-align:center}
#pcard{width:min(100%,440px);font-size:clamp(9px,2.4vw,12px);line-height:1.9}
#pcard h2{margin:0 0 8px;color:var(--gold);font-size:clamp(14px,4vw,22px)}
#pcard button{margin:3px}
ol.lb{list-style:none;margin:8px 0;padding:0;text-align:left}
ol.lb li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
ol.lb li.me{background:rgba(255,183,3,.2)}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}
.star{font-size:28px;background:#243b53;color:#6b7c93;padding:8px 10px}
.star.on{color:#ffd23f}
.okb{background:#2a9d4a}
.okb:disabled{opacity:.4}
#rate{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;background:var(--gold);color:#000;border-radius:999px;padding:11px 14px;font-size:11px}
body.playing #rate{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="c" width="800" height="450" aria-label="Karvo Run game"></canvas>
  <div id="hud">
   <div id="bar"><button id="home">MENU</button><button id="pz">PAUSE</button><button id="mu">SOUND ON</button></div>
   <div id="pad"><button id="bl" aria-label="Left">&lt;</button><button id="br" aria-label="Right">&gt;</button><button id="bj">JUMP</button></div>
  </div>
  <div id="menu">
   <h1>KARVO RUN</h1>
   <p>Run with Karvo. Collect coins, jump on Gumbos and avoid the pits.</p>
   <div id="who"><div id="hi" hidden></div><div id="nmsg" role="status"></div><div id="avg"></div></div>
   <button id="b1">1. PLAY</button>
   <button id="b2">2. AUTO PLAY (LOCKED)</button>
   <button id="b3">LEADERBOARD</button>
   <button id="skin">CHANGE COLOR</button>
   <button id="hp">HOW TO PLAY</button>
   <button id="pwset" hidden>SET PASSWORD</button>
   <button id="cpw" hidden>CHANGE PASSWORD</button>
   <button id="lo" hidden>LOGOUT</button>
   <div id="pw" hidden>
    <input id="pwi" type="password" placeholder="Password" autocomplete="off" aria-label="Password">
    <button id="pwok">UNLOCK</button>
    <div id="err" role="alert"></div>
   </div>
   <small>Move: &larr; &rarr; or A D. Jump: Space or &uarr;. On phones use the on-screen buttons. The game speeds up as you go.</small>
  </div>
  <div id="panel" hidden><div id="pcard"></div><button id="pclose">CLOSE</button></div>
  <button id="rate" hidden aria-label="Rate this game">&#9733; RATE</button>
 </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=800;const H=450,G=370,T=32,PASS='karv123';
let mode=null,state='menu',cam=0,solids=[],coins=[],enemies=[],genX=0,first=true,p,bonus=0,coinsN=0,lives=3,best=0,deadT=0,frame=0,face=1;
const keys={},touch={l:0,r:0,j:0};
const $=id=>document.getElementById(id);
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rnd=n=>Math.floor(Math.random()*n);

function reset(full){
  plan=[];lvl=1;combo=0;fx=[];banner=0;
  solids=[];coins=[];enemies=[];cam=0;genX=0;first=true;
  p={x:80,y:G-34,w:26,h:34,vx:0,vy:0,on:false,pb:G};
  if(full){bonus=0;coinsN=0;lives=3}
  gen();
}
/* patterns: har segment ek alag pattern, kabhi same pattern lagatar nahi */
const pipe=(x0,t,hh)=>solids.push({x:x0+t*T,y:G-hh,w:48,h:hh,ow:0,pipe:1});
const brick=(x0,t,hh)=>solids.push({x:x0+t*T,y:G-hh,w:T,h:hh,ow:0,pipe:1,brick:1});
const gumbo=(x0,t,a,b)=>enemies.push({x:x0+t*T,y:G-28,w:28,h:28,dir:rnd(2)?1:-1,a:x0+a*T,b:x0+b*T,dead:0});
const coin=(x,y)=>coins.push({x:x,y:y,got:0});
const plat=(x0,t,n,yo)=>{solids.push({x:x0+t*T,y:G-yo,w:n*T,h:16,ow:1});for(let i=0;i<n;i++)coin(x0+(t+i)*T+16,G-yo-30)};
const arc=(cx,top)=>{coin(cx-30,top+16);coin(cx,top);coin(cx+30,top+16)};
const gapw=x=>(2+(Math.random()<Math.min(.8,x/15000)?1:0))*T;
const PATS=[
 {min:0,f:(x0,s)=>{for(let i=2;i<7+s;i+=2)coin(x0+i*T+16,G-30);return 9+s}},
 {min:0,f:(x0,s)=>{pipe(x0,5+s,64);arc(x0+(5+s)*T+24,G-135);return 12+s}},
 {min:1500,f:(x0,s)=>{pipe(x0,5+s,96);arc(x0+(5+s)*T+24,G-165);return 13+s}},
 {min:900,f:(x0,s)=>{pipe(x0,5+s,64);pipe(x0,11+s,64);arc(x0+(5+s)*T+24,G-135);arc(x0+(11+s)*T+24,G-135);return 17+s}},
 {min:1200,f:(x0,s)=>{const o=5+s;[32,64,96].forEach((hh,i)=>brick(x0,o+i,hh));coin(x0+(o+3)*T+16,G-126);coin(x0+(o+4)*T+16,G-126);brick(x0,o+3,96);brick(x0,o+4,96);[96,64,32].forEach((hh,i)=>brick(x0,o+5+i,hh));return 18+s}},
 {min:2000,f:(x0,s)=>{gumbo(x0,5+s,3,13+s);gumbo(x0,8+s,3,13+s);if(Math.random()<.6)gumbo(x0,11+s,3,13+s);return 17+s}},
 {min:600,f:(x0,s)=>{gumbo(x0,4+s,3,8+s);pipe(x0,11+s,64);arc(x0+(11+s)*T+24,G-135);return 17+s}},
 {min:800,f:(x0,s)=>{plat(x0,3+s,3,120);plat(x0,8+s,3,100);gumbo(x0,6+s,5,13+s);return 17+s}},
 {min:300,f:(x0,s)=>{gumbo(x0,5+s,3,10+s);for(let i=0;i<3;i++)coin(x0+(6+s+i)*T+16,G-30);return 13+s}},
 {min:1000,f:(x0,s)=>{islands=2;return 5}},
 {min:500,f:(x0,s)=>{plat(x0,4+s,4,110);gumbo(x0,7+s,3,13+s);return 16+s}},
 {min:1400,f:(x0,s)=>{[4,8,12].forEach(t=>{brick(x0,t+s,32);coin(x0+(t+s)*T+16,G-62)});return 17+s}},
 {min:1800,f:(x0,s)=>{plat(x0,3+s,2,120);plat(x0,7+s,2,100);plat(x0,11+s,2,120);gumbo(x0,6+s,3,13+s);return 17+s}},
 {min:1100,f:(x0,s)=>{pipe(x0,5+s,64);gumbo(x0,10+s,8+s,14+s);return 18+s}}
];
let lastPat=-1,prevPat=-1,islands=0;
function gen(){
  while(genX<cam+W+700){
    const x0=genX,ex=Math.ceil(Math.min(1,Math.max(0,(x0-80)/T/800))*6);let len,gw=gapw(x0);
    if(first){len=14}
    else if(islands>0){islands--;len=5+ex;gw=2*T;if(islands===0)gw=gapw(x0)}
    else{
      let k,tries=0;
      do{k=rnd(PATS.length);tries++}while((k===lastPat||k===prevPat||x0<PATS[k].min)&&tries<40);
      prevPat=lastPat;lastPat=k;
      len=PATS[k].f(x0,rnd(3))+ex;
      if(k===9)gw=2*T;
    }
    solids.push({x:x0,y:G,w:len*T,h:H-G+60,ow:0});
    if(!first)[-100,-120,-100].forEach((dy,i)=>coin(x0+len*T+gw*(i+1)/4,G+dy));
    genX=x0+len*T+gw;first=false;
  }
  solids=solids.filter(s=>s.x+s.w>cam-150);
  coins=coins.filter(c=>c.x>cam-100);
  enemies=enemies.filter(e=>e.x>cam-150);
}
function human(){
  return{l:keys.ArrowLeft||keys.a||touch.l,r:keys.ArrowRight||keys.d||touch.r,j:keys[' ']||keys.ArrowUp||keys.w||touch.j};
}
/* AI: aage 95 frame ka future simulate karta hai, jisme coin zyada mile aur marna na pade wo plan chunta hai */
const solidAt=(x,y)=>solids.some(s=>x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h);
function react(q,es,S){
  const fx=q.x+q.w;
  if(!S.some(s=>fx+10>=s.x&&fx+10<s.x+s.w&&s.y>=q.y+q.h-2))return 1;
  for(const s of S)if(s.pipe&&s.x>=fx-1&&s.x-fx<58)return 1;
  for(const e of es)if(!e.dead&&e.x+e.w>q.x&&e.x-fx<75)return 1;
  return 0;
}
let waitN=0,lastPx=0,stk=0,SP=4.2,lvl=1,combo=0,fx=[],banner=0,bannerT='',plan=[],botMs=0,lite=0;
const DS_FULL=[-1,...Array.from({length:30},(_,i)=>i*2),...Array.from({length:7},(_,i)=>64+i*4)];
const DS_LITE=[-1,...Array.from({length:15},(_,i)=>i*4),...Array.from({length:4},(_,i)=>64+i*8)];
/* bot: har 3 frame mein sochta hai, beech ke frame mein tay kiya hua plan chalata hai (phone par halka) */
function bot(){
  if(plan.length)return plan.shift();
  const t0=performance.now();
  let a;
  try{a=think()}catch(e){a=[{l:0,r:1,j:0}]}
  const dt=performance.now()-t0;botMs=botMs*.9+dt*.1;
  if(botMs>5)lite=1;else if(botMs<2.5)lite=0;
  plan=a.slice(1);return a[0];
}
function think(){
  const K=3,HZ=lite?120:150;
  const ns=solids.filter(s=>s.x+s.w>p.x-80&&s.x<p.x+1100);
  const cs=coins.filter(c=>c.x>p.x-20&&c.x<p.x+700);
  const es0=enemies.filter(e=>e.x<p.x+800&&e.x>p.x-100).map(e=>({x:e.x,y:e.y,w:e.w,h:e.h,dir:e.dir,a:e.a,b:e.b,dead:e.dead}));
  const ds=p.on?(lite?DS_LITE:DS_FULL):[-1],HLS=lite?[99,8]:[99,9,5];
  let best=-1e12,act=[{l:0,r:1,j:0}],bm=-1e12,mv=[{l:0,r:1,j:0}];
  for(const rr of [1,0])for(const d of ds)for(const hl of HLS){
    if(!rr&&(d>0||hl<99))continue;
    const q={x:p.x,y:p.y,w:p.w,h:p.h,vx:p.vx,vy:p.vy,on:p.on,pb:p.pb};
    const es=es0.map(e=>({x:e.x,y:e.y,w:e.w,h:e.h,dir:e.dir,a:e.a,b:e.b,dead:e.dead}));
    const got=cs.map(()=>0),acts=[];
    let jumped=p.on?0:1,hold=(!p.on&&p.vy<0)?1:0,hf=(!p.on&&p.vy<0)?Math.round((p.vy+13)/.6):0,n=0,sc=0,dead=0,t;
    for(t=0;t<HZ;t++){
      let j=0;
      if(q.on){
        hold=0;hf=0;
        if(d>=0&&t>=d&&!jumped){j=1;jumped=1}
        else if((d<0||jumped)&&react(q,es,ns))j=1;
        if(j)hold=1;
      }else if(hold&&q.vy<0){if(hf<hl)j=1;hf++}
      if(t<K)acts.push({l:0,r:rr,j:j});
      q.pb=q.y+q.h;
      q.vx+=(rr?SP:0)*.25-q.vx*.25;
      if(j&&q.on){q.vy=-13;q.on=false}
      if(!j&&q.vy<-5)q.vy=-5;
      q.vy=Math.min(14,q.vy+.6);
      move(q,ns);
      for(const e of es){
        if(e.dead)continue;
        e.x+=e.dir;if(e.x<e.a)e.dir=1;if(e.x>e.b)e.dir=-1;
        if(hit(q,e)){if(q.vy>0&&q.pb<=e.y+10){e.dead=1;q.vy=-8;sc+=5}else dead=1}
      }
      for(let k=0;k<cs.length;k++)if(!got[k]&&Math.hypot(q.x+13-cs[k].x,q.y+17-cs[k].y)<28){got[k]=1;n++}
      if(q.y+q.h>G+24)dead=1;
      if(dead)break;
    }
    sc+=dead?-1e6+t:1000+n*40+(q.x-p.x)*.5-(d>=0?.5:0)-(hl<99?.2:0)-(rr?0:600);
    if(sc>best){best=sc;act=acts}
    if(rr&&sc>bm){bm=sc;mv=acts}
  }
  if(p.on&&!act[0].r){waitN++;if(waitN>14)return mv}else waitN=0;
  return act;
}
function move(q,S){
  S=S||solids;
  q.x+=q.vx;if(q.x<cam){q.x=cam;q.vx=0}
  for(const s of S){if(s.ow||!hit(q,s))continue;if(q.vx>0)q.x=s.x-q.w;else if(q.vx<0)q.x=s.x+s.w;q.vx=0}
  q.y+=q.vy;q.on=false;
  for(const s of S){
    if(!hit(q,s))continue;
    if(s.ow){if(q.vy>=0&&q.pb<=s.y+1){q.y=s.y-q.h;q.vy=0;q.on=true}}
    else if(q.vy>0){q.y=s.y-q.h;q.vy=0;q.on=true}
    else if(q.vy<0){q.y=s.y+s.h;q.vy=0}
  }
}
function die(){state='dying';deadT=70;p.vy=-10;sfx('die')}
function afterDeath(){
  if(mode==='real'){lives--;if(lives<=0){state='over';sfx('over');postScore().then(r=>{if(state==='over')openOver(r)});return}}
  reset(false);state='play';
}
function score(){return Math.max(0,Math.floor((p.x-80)/T))+bonus}
function update(){
  frame++;
  if(state==='dying'){p.vy+=.6;p.y+=p.vy;if(--deadT<=0)afterDeath();return}
  if(state!=='play')return;
  SP=4.2+Math.min(1.8,Math.max(0,(p.x-80)/T)/800*1.8);
  const lv=1+Math.floor(Math.max(0,p.x-80)/T/100);if(lv>lvl){lvl=lv;banner=120;bannerT='LEVEL '+lv+'  SPEED UP!';sfx('lvl')}
  for(const f of fx){f.x+=f.vx;f.y+=f.vy;if(!f.t)f.vy+=.2;f.l--}
  fx=fx.filter(f=>f.l>0);if(banner>0)banner--;
  if(mode==='real')runMax=Math.max(runMax,score());
  const inp=mode==='auto'?bot():human();
  p.pb=p.y+p.h;
  p.vx+=((inp.r?1:0)-(inp.l?1:0))*SP*.25-p.vx*.25;
  if(inp.r&&!inp.l)face=1;if(inp.l&&!inp.r)face=-1;
  if(inp.j&&p.on){p.vy=-13;p.on=false;sfx('jump')}
  if(p.on)combo=0;
  if(!inp.j&&p.vy<-5)p.vy=-5;
  p.vy=Math.min(14,p.vy+.6);
  move(p);
  if(p.on&&p.y+p.h>=G-2)p.sx=p.x;
  if(mode==='auto'){
    if(Math.abs(p.x-lastPx)<.5)stk++;else{stk=0;lastPx=p.x}
    if(stk>90){
      stk=0;const n0=solids.length;
      solids=solids.filter(s=>!(s.pipe&&s.x>p.x&&s.x-p.x<120));
      if(solids.length===n0){const g=solids.filter(s=>!s.ow&&!s.pipe&&s.x>p.x+10).sort((a,b)=>a.x-b.x)[0];if(g){p.x=g.x+6;p.y=G-40;p.vx=0;p.vy=0}}
    }
  }
  for(const e of enemies){
    if(e.dead){if(--e.dead===0)e.gone=1;continue}
    e.x+=e.dir;if(e.x<e.a)e.dir=1;if(e.x>e.b)e.dir=-1;
    if(hit(p,e)){
      if(p.vy>0&&p.pb<=e.y+10){e.dead=20;p.vy=-8;combo++;const v=20*combo;bonus+=v;pop(e.x+14,e.y-6,'+'+v+(combo>1?' COMBO':''));burst(e.x+14,e.y+14,'#9d4edd',10);sfx('stomp')}
      else if(mode==='auto'){e.dead=20}
      else{die();return}
    }
  }
  enemies=enemies.filter(e=>!e.gone);
  for(const c of coins)if(!c.got&&Math.hypot(p.x+13-c.x,p.y+17-c.y)<28){c.got=1;coinsN++;bonus+=10;burst(c.x,c.y,'#ffd23f',5);sfx('coin')}
  coins=coins.filter(c=>!c.got);
  if(p.y>H+60){if(mode==='auto'){p.x=p.sx||80;p.y=G-60;p.vx=0;p.vy=0}else{die();return}}
  cam=Math.max(cam,p.x-260);
  gen();
  best=Math.max(best,score());
}

    const cur=await this.call('GET','scores/'+this.uid+'/best');
    if(cur.data!==null&&cur.data!==undefined&&+cur.data>=sc)return;
    await this.call('PUT','scores/'+this.uid,{name:m.name,best:sc,country:m.country,state:m.state,cb:m.country+'|'+pad9(sc),sb:skey(m)+'|'+pad9(sc),t:Date.now()});
  },
  async board(tab,m){
    let q='limitToLast=20&orderBy='+encodeURIComponent('"best"');
    if(tab==='country'&&m)q='limitToLast=20&orderBy='+encodeURIComponent('"cb"')+'&startAt='+encodeURIComponent(JSON.stringify(m.country+'|'))+'&endAt='+encodeURIComponent(JSON.stringify(m.country+'|\uf8ff'));
    if(tab==='state'&&m)q='limitToLast=20&orderBy='+encodeURIComponent('"sb"')+'&startAt='+encodeURIComponent(JSON.stringify(skey(m)+'|'))+'&endAt='+encodeURIComponent(JSON.stringify(skey(m)+'|\uf8ff'));
    const r=await this.call('GET','scores',undefined,q);
    if(r.denied)throw new Error('denied');
    return Object.values(r.data||{}).map(v=>({n:String(v.name||'?'),s:+v.best||0,c:String(v.state&&v.state!=='NA'?v.state+', ':'')+String(v.country||'')})).sort((a,b)=>b.s-a.s).slice(0,20);
  },
  async rate(st){await this.call('PUT','ratings/'+this.uid,{stars:st,t:Date.now()})},
  async avg(){
    const r=await this.call('GET','ratings',undefined,'limitToLast=500&orderBy='+encodeURIComponent('"$key"'));
    let s=0,n=0;Object.values(r.data||{}).forEach(v=>{const x=+v.stars;if(x>=1&&x<=5){s+=x;n++}});return n?{avg:s/n,n:n}:null;
  }
};
function showName(){
  $('hi').hidden=!ME;$('hi').textContent=ME?'Player: '+ME.name+'  ('+(ME.state&&ME.state!=='NA'?ME.state+', ':'')+ME.country+')':'';
  $('rate').hidden=!!RATED||!ME;$('lo').hidden=!(ME&&FBON);$('pwset').hidden=!(ME&&FBON&&net.on&&net.hasPw===false);$('cpw').hidden=!(ME&&FBON&&net.on&&net.hasPw===true);
  if(!FBON)$('avg').textContent='Offline mode: this device only';
  else if(ME&&!net.on)$('avg').textContent='Not connected online yet';
}
async function loadAvg(){
  if(!net.on)return;
  try{const a=await net.avg();$('avg').textContent=a?'Rating: '+a.avg.toFixed(1)+' / 5 ('+a.n+' players)':''}catch(e){}
}
async function initOnline(){
  try{await net.init();if(net.on)loadAvg()}catch(e){}
  showName();
}
const panel=$('panel'),card=$('pcard');
function openPanel(closable){panel.hidden=false;card.textContent='';$('pclose').hidden=closable===false}
function authMsg(e){
  const c=e&&e.code||e&&e.message||'';
  if(c==='EMAIL_EXISTS')return 'That name is already taken. Choose another name. If this is your account, go back and SIGN IN.';
  if(c==='WEAK_PASSWORD')return 'Password must be at least 6 characters.';
  if(c==='EMAIL_NOT_FOUND'||c==='INVALID_PASSWORD'||c==='INVALID_LOGIN_CREDENTIALS')return 'Wrong name or password.';
  if(c==='TOO_MANY_ATTEMPTS_TRY_LATER')return 'Too many attempts. Please try again later.';
  if(c==='OPERATION_NOT_ALLOWED')return 'Firebase blocked this request ('+c+'). Check that Email/Password is enabled in Firebase Authentication.';
  if(c==='NET'||c==='net')return 'No internet connection. Please try again.';
  return 'Something went wrong ('+c+'). Please try again.';
}
const fld=(ph,type,max)=>{const e=mk('input',null,'fld');e.type=type||'text';e.placeholder=ph;if(max)e.maxLength=max;e.autocomplete='off';e.setAttribute('aria-label',ph);return e};
function openWelcome(){
  openPanel(false);
  const a=mk('button','CREATE NEW ACCOUNT','okb'),b=mk('button','SIGN IN (existing account)'),row=mk('div',null,'row2');
  a.onclick=()=>openRegister();b.onclick=openSignIn;row.append(a,b);
  card.append(mk('h2','Karvo Run'),mk('div','You need an account to play. New here? Create an account. Already have one? Sign in.'),row);
}
function openRegister(pre){
  openPanel(false);
  const nm=fld('Your name (2-12 characters)','text',12),pw=fld('Password (at least 6)','password',30),cty=mk('select',null,'fld'),stBox=mk('div'),err=mk('div','','err');
  const ok=mk('button',pre?'SAVE PROFILE':'CREATE ACCOUNT','okb'),back=mk('button','BACK'),show=mk('button','SHOW PASSWORD');
  COUNTRIES.forEach(c=>{const o=mk('option',c);o.value=c;cty.append(o)});
  let stEl=null;
  const setSt=()=>{stBox.textContent='';const L=STATES[cty.value];
    if(L){stEl=mk('select',null,'fld');L.forEach(s=>{const o=mk('option',s);o.value=s;stEl.append(o)})}
    else{stEl=mk('input',null,'fld');stEl.maxLength=24;stEl.placeholder='State / Region (khaali chhod sakte ho)'}
    stEl.setAttribute('aria-label','State');stBox.append(stEl)};
  cty.onchange=setSt;setSt();
  show.onclick=()=>{pw.type=pw.type==='password'?'text':'password'};back.onclick=openWelcome;
  if(pre){nm.value=pre;nm.disabled=true}
  ok.onclick=async()=>{
    const raw=nm.value.trim().replace(/\s+/g,' ');
    if(!/^[\p{L}\p{N} _-]{2,12}$/u.test(raw)){err.textContent='Name must be 2-12 characters (letters, numbers, spaces).';return}
    if(FBON&&!pre&&(pw.value.length<6||pw.value.length>30)){err.textContent='Password must be 6 to 30 characters.';return}
    let st=String(stEl.value||'').trim();if(!STATES[cty.value]&&!/^[\p{L}\p{N} .'-]{0,24}$/u.test(st)){err.textContent='Please enter a valid state.';return}
    if(!st)st='NA';
    ok.disabled=true;err.textContent='Checking...';
    const m={name:raw,country:cty.value,state:st};
    if(FBON){
      try{
        if(!pre)await net.signUp(raw,pw.value);
        if(!(await net.saveMe(m))){err.textContent='This name already has a profile. Go back and SIGN IN.';ok.disabled=false;return}
      }catch(e){err.textContent=authMsg(e);ok.disabled=false;return}
    }
    ME=m;NAME=raw;LS.set('me',ME);showName();panel.hidden=true;loadAvg();
  };
  card.append(mk('h2',pre?'Complete your profile':'New account'),mk('div',pre?'Just choose your country and state.':'Your name is visible to everyone and belongs to one player only. Remember your password: if you forget it, it cannot be recovered.'),nm);
  if(!pre&&FBON)card.append(pw,show);
  card.append(cty,stBox,err,ok);
  if(!pre)card.append(back);
}
function openSignIn(){
  openPanel(false);
  const nm=fld('Name','text',12),pw=fld('Password','password',30),err=mk('div','','err'),ok=mk('button','SIGN IN','okb'),back=mk('button','BACK'),show=mk('button','SHOW PASSWORD');
  show.onclick=()=>{pw.type=pw.type==='password'?'text':'password'};back.onclick=openWelcome;
  ok.onclick=async()=>{
    const raw=nm.value.trim().replace(/\s+/g,' ');
    if(raw.length<2||!pw.value){err.textContent='Enter both name and password.';return}
    ok.disabled=true;err.textContent='Checking...';
    try{
      await net.signIn(raw,pw.value);
      if(!(await net.loadMe())){openRegister(raw);return}
      showName();panel.hidden=true;loadAvg();
    }catch(e){err.textContent=authMsg(e);ok.disabled=false}
  };
  card.append(mk('h2','Sign in'),mk('div','Enter the name and password you used to create your account.'),nm,pw,show,err,ok,back);
}
function openSetPassword(){
  openPanel();
  const pw=fld('New password (6-30 characters)','password',30),err=mk('div','','err'),ok=mk('button','SAVE PASSWORD','okb'),show=mk('button','SHOW PASSWORD');
  show.onclick=()=>{pw.type=pw.type==='password'?'text':'password'};
  ok.onclick=async()=>{
    if(pw.value.length<6||pw.value.length>30){err.textContent='Password must be 6 to 30 characters.';return}
    ok.disabled=true;err.textContent='Saving...';
    try{await net.setPassword(pw.value);showName();card.textContent='';card.append(mk('h2','Password saved'),mk('div','You can now sign in on any phone with your name and this password. Remember it: it cannot be recovered.'))}
    catch(e){err.textContent=authMsg(e);ok.disabled=false}
  };
  card.append(mk('h2','Set a password'),mk('div','Add a password to your account so you can sign in on other phones. Your name, score and progress stay the same.'),pw,show,err,ok);
}
function openChangePassword(){
  openPanel();
  const o=fld('Current password','password',30),n=fld('New password (6-30 characters)','password',30),err=mk('div','','err'),ok=mk('button','CHANGE PASSWORD','okb'),show=mk('button','SHOW PASSWORDS');
  show.onclick=()=>{const t=o.type==='password'?'text':'password';o.type=t;n.type=t};
  ok.onclick=async()=>{
    if(!o.value){err.textContent='Enter your current password.';return}
    if(n.value.length<6||n.value.length>30){err.textContent='New password must be 6 to 30 characters.';return}
    ok.disabled=true;err.textContent='Saving...';
    try{await net.changePassword(o.value,n.value);card.textContent='';card.append(mk('h2','Password changed'),mk('div','Use your new password the next time you sign in on another phone.'))}
    catch(e){const c=e&&e.code||'';err.textContent=(c==='INVALID_LOGIN_CREDENTIALS'||c==='INVALID_PASSWORD'||c==='EMAIL_NOT_FOUND')?'Your current password is wrong.':authMsg(e);ok.disabled=false}
  };
  card.append(mk('h2','Change password'),mk('div','Enter your current password and choose a new one.'),o,n,show,err,ok);
}
function openHelp(){
  openPanel();
  const L=['Karvo runs forward by himself. You only jump and stop.','Collect coins (+10). Jump on a Gumbo to defeat it (+20). Chain jumps for combo bonuses.','Falling into a pit or touching a Gumbo costs 1 life. You get 3 lives.','Every 100 tiles is a new LEVEL. The game gets faster, up to a limit.','Jump: Space, Up arrow or the JUMP button. Hold it to jump higher.','The SOUND button turns music and sound effects on or off.','AUTO PLAY mode needs a password.'];
  card.append(mk('h2','How to play'));
  L.forEach(t=>card.append(mk('div','• '+t)));
}
async function postScore(){
  const out={sc:runMax,nb:false};
  if(mode!=='real'||!ME||runMax<=0)return out;
  const sc=runMax;runMax=0;out.sc=sc;
  const lb=LS.get('lb',[]);lb.push({n:ME.name,s:sc});lb.sort((a,b)=>b.s-a.s);LS.set('lb',lb.slice(0,20));
  if(sc>myBest){out.nb=true;myBest=sc;LS.set('best',sc)}
  if(net.on){try{await net.post(sc,ME)}catch(e){LS.set('pend',Math.max(+LS.get('pend',0),sc))}}
  else if(FBON)LS.set('pend',Math.max(+LS.get('pend',0),sc));
  return out;
}
async function openLB(tab){
  tab=tab||'world';openPanel();card.append(mk('h2','Leaderboard'));
  const tabs=mk('div',null,'tabs');
  [['world','World'],['country','My Country'],['state','My State']].forEach(([k,t])=>{if(k!=='world'&&!ME)return;const b=mk('button',t);if(k===tab)b.className='on';b.onclick=()=>openLB(k);tabs.append(b)});
  const list=mk('ol',null,'lb'),foot=mk('div','Loading...');card.append(tabs,list,foot);
  let rows=null;
  if(net.on){try{rows=await net.board(tab,ME)}catch(e){rows=null}}
  const all=rows!==null;
  if(!all)rows=LS.get('lb',[]).map(v=>({n:v.n,s:v.s,c:''}));
  if(!rows.length)list.append(mk('li','No scores yet. Be the first to play!'));
  rows.forEach((r,i)=>{const li=mk('li');li.className=ME&&r.n===ME.name?'me':'';const l=mk('span',(i+1)+'. '+r.n);if(r.c){l.append(mk('small',' '+r.c))}li.append(l,mk('span',String(r.s)));list.append(li)});
  foot.textContent=(all?'Top 20 players. ':'This device only (online is not available right now). ')+'Your best: '+myBest;
}
function openOver(r){
  openPanel();
  const row=mk('div',null,'row2'),b1=mk('button','PLAY AGAIN','okb'),b2=mk('button','SHARE'),b3=mk('button','LEADERBOARD'),b4=mk('button','MENU');
  b1.onclick=()=>start('real');b3.onclick=()=>openLB('world');b4.onclick=home;
  b2.onclick=async()=>{const t='I scored '+r.sc+' in Karvo Run! Can you beat me? '+location.href;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);b2.textContent='COPIED'}}catch(e){}};
  row.append(b1,b2,b3,b4);if(r.nb)sfx('rec');
  card.append(mk('h2','GAME OVER'),mk('div','Score: '+r.sc),mk('div','Best: '+myBest+(r.nb?'   NEW RECORD!':'')),row);
}
function openRate(){
  openPanel();let st=0;
  const row=mk('div',null,'stars'),bs=[],ok=mk('button','SUBMIT RATING','okb');ok.disabled=true;
  for(let i=1;i<=5;i++){const b=mk('button','★','star');b.setAttribute('aria-label',i+' star');b.onclick=()=>{st=i;bs.forEach((x,k)=>x.classList.toggle('on',k<i));ok.disabled=false};bs.push(b);row.append(b)}
  ok.onclick=async()=>{
    if(!st||RATED)return;
    RATED=1;LS.set('rated',1);LS.set('stars',st);
    try{if(net.on)await net.rate(st)}catch(e){}
    showName();card.textContent='';card.append(mk('h2','Thank you!'),mk('div',st+' stars received. You can rate only once.'));loadAvg();
  };
  card.append(mk('h2','Rate this game'),mk('div','You can rate only once.'),row,ok);
}
$('hp').onclick=openHelp;
$('pwset').onclick=openSetPassword;
$('cpw').onclick=openChangePassword;
$('lo').onclick=()=>{if(!confirm('Log out? You will need your name and password to sign in again.'))return;net.logout();showName();openWelcome()};
$('b3').onclick=()=>openLB('world');
$('rate').onclick=openRate;
$('pclose').onclick=()=>{panel.hidden=true};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause()});
showName();initOnline().then(()=>{if(!ME)openWelcome()});
reset(true);requestAnimationFrame(loop);
</script>
